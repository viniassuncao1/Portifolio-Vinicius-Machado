@if (run.aberto()) {
  <section
    #secao
    class="janela"
    aria-labelledby="titulo-da-janela-de-run"
    tabindex="-1"
    [attr.data-execucao]="run.execucao()"
    [attr.data-terminado]="run.terminado()"
  >
    <header class="cabecalho">
      <h2 id="titulo-da-janela-de-run" class="titulo">Run</h2>
      <span class="aba" aria-hidden="true">PortfolioApplication</span>
      @if (!run.terminado()) {
        <button type="button" class="pular" (click)="run.concluir()">Pular</button>
      }
      <button type="button" class="fechar" aria-label="Fechar a janela de Run" (click)="fechar()">
        <app-glifo-fechar />
      </button>
    </header>
    <pre
      #log
      class="log"
      translate="no"
      tabindex="0"
      role="region"
      aria-label="Log de inicialização do PortfolioApplication"
    ><code>@for (linha of linhas(); track $index; let i = $index) {<span class="linha" [attr.data-indice]="i" [style.--indice]="i">@for (trecho of linha.trechos; track $index) {<span [class]="'papel-' + trecho.papel">{{ trecho.texto }}</span>}</span>}</code></pre>
    <p class="somente-leitores" aria-live="polite">{{ anuncio() }}</p>
  </section>
}
