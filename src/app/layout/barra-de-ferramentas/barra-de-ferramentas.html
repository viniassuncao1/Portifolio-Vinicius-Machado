<button
  #botaoProjeto
  type="button"
  class="botao projeto-celular"
  aria-label="Projeto"
  aria-controls="painel-lateral"
  [attr.aria-expanded]="gavetaAberta()"
  (click)="alternarGaveta.emit()"
>
  <app-icone nome="projeto" />
</button>
<span class="widget projeto" aria-hidden="true">
  <span class="selo">PV</span>
  {{ projeto }}
  <app-icone nome="seta-para-baixo" />
</span>
<span class="widget ramo" aria-hidden="true">
  <app-icone nome="ramo" />
  {{ ramo }}
  <app-icone nome="seta-para-baixo" />
</span>
<span class="espaco"></span>
<span class="widget configuracao" aria-hidden="true">
  {{ configuracao }}
  <app-icone nome="seta-para-baixo" />
</span>
@if (janela.previewDaRota()) {
  <button
    type="button"
    class="botao executar"
    aria-label="Executar o projeto"
    (click)="executar($event)"
  >
    <app-icone nome="executar" />
  </button>
} @else {
  <span class="botao executar" aria-hidden="true"><app-icone nome="executar" /></span>
}
<span class="botao depurar" aria-hidden="true"><app-icone nome="depurar" /></span>
<button
  type="button"
  class="botao botao-busca"
  aria-haspopup="dialog"
  aria-label="Buscar seção (Ctrl+P)"
  (click)="buscar.emit()"
>
  <app-icone nome="buscar" />
</button>
<span class="botao configuracoes" aria-hidden="true"><app-icone nome="configuracoes" /></span>
