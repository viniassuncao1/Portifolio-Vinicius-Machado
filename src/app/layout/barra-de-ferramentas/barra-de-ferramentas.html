<div class="botoes">
  @for (botao of botoes; track botao.icone) {
    @if (botao.icone === 'executar' && janela.previewDaRota()) {
      <button
        type="button"
        class="botao executar"
        aria-label="Executar o projeto"
        [style.--x]="botao.x"
        (click)="executar($event)"
      >
        <app-icone [nome]="botao.icone" />
      </button>
    } @else {
      <app-icone class="botao" [nome]="botao.icone" [style.--x]="botao.x" />
    }
  }
</div>
<svg class="controles-janela" viewBox="0 0 120 24" focusable="false" aria-hidden="true">

  <path d="M96 4l12 14M108 4L96 18" />
</svg>
