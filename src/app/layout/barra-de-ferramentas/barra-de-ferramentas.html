<button
  #botaoProjeto
  type="button"
  class="botao projeto-celular"
  aria-label="Projeto"
  aria-controls="painel-lateral"
  [attr.aria-expanded]="gavetaAberta()"
  (click)="alternarGaveta.emit()"
>
  <app-icone nome="projeto" variante="clara" />
</button>
@if (janela.previewDaRota()) {
  <button
    type="button"
    class="botao executar"
    aria-label="Executar o projeto"
    (click)="executar($event)"
  >
    <app-icone nome="executar" variante="clara" />
  </button>
} @else {
  <span class="botao executar" aria-hidden="true">
    <app-icone nome="executar" variante="clara" />
  </span>
}
<span class="botao depurar" aria-hidden="true"><app-icone nome="depurar" variante="clara" /></span>
<button
  type="button"
  class="botao botao-busca"
  aria-haspopup="dialog"
  aria-label="Buscar seção (Ctrl+P)"
  (click)="buscar.emit()"
>
  <app-icone nome="buscar" variante="clara" />
</button>
<span class="botao configuracoes" aria-hidden="true">
  <app-icone nome="configuracoes" variante="clara" />
</span>
<span class="ramo" aria-hidden="true">
  <app-icone nome="ramo" variante="clara" />
  {{ ramo }}
</span>
<svg class="controles-janela" viewBox="0 0 120 24" focusable="false" aria-hidden="true">
  <path d="M8 13h14" />
  <path d="M52 5h11v11H52z M63 5l2-2v11l-2 2" />
  <path d="M96 4l12 14M108 4L96 18" />
</svg>
