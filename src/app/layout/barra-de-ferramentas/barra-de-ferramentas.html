<button
  type="button"
  class="projeto"
  aria-label="Portfolio_Vinicius, ir para o início"
  (click)="irParaOInicio()"
>
  <span class="selo" aria-hidden="true">VM</span>
  <span class="nome-do-projeto">Portfolio_Vinicius</span>
  <svg class="seta" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
    <path fill="none" stroke="currentColor" stroke-width="1.4" d="m4.5 6.5 3.5 3.5 3.5-3.5" />
  </svg>
</button>
<span class="botao decorativo" aria-hidden="true"><app-icone nome="design-arquivo" /></span>
<span class="botao decorativo" aria-hidden="true"><app-icone nome="design-pasta" /></span>
<span class="botao decorativo" aria-hidden="true"><app-icone nome="design-projeto" /></span>
@if (janela.previewDaRota()) {
  <button
    type="button"
    class="botao executar"
    aria-label="Executar o projeto"
    (click)="executar($event)"
  >
    <app-icone nome="design-executar" />
  </button>
} @else {
  <button
    type="button"
    class="botao executar"
    aria-label="Executar PortfolioApplication"
    (click)="executarAplicacao($event)"
  >
    <app-icone nome="design-executar" />
  </button>
}
<span class="botao decorativo" aria-hidden="true"><app-icone nome="design-ferramenta" /></span>
<span class="botao decorativo" aria-hidden="true"><app-icone nome="design-ia" /></span>
<span class="botao decorativo" aria-hidden="true"><app-icone nome="design-relogio" /></span>
<span class="botao decorativo" aria-hidden="true"><app-icone nome="design-monitor" /></span>
<button
  type="button"
  class="botao botao-busca"
  aria-haspopup="dialog"
  aria-label="Buscar seção (Ctrl+K)"
  aria-keyshortcuts="Control+K Meta+K"
  (click)="buscar.emit()"
>
  <app-icone nome="buscar" />
  <span class="rotulo-busca" aria-hidden="true">Buscar</span>
  <kbd class="atalho-busca" aria-hidden="true">{{ atalhoDaBusca() }}</kbd>
</button>
<button
  type="button"
  class="botao botao-tema"
  [attr.aria-label]="tema.claro() ? 'Usar tema escuro' : 'Usar tema claro'"
  [attr.aria-pressed]="tema.claro()"
  (click)="tema.alternar()"
>
  <app-icone [nome]="tema.claro() ? 'design-lua' : 'design-sol'" />
</button>
<button
  type="button"
  class="ramo"
  aria-label="Branch master, abrir o repositório"
  (click)="abrirRepositorio()"
>
  <app-icone nome="ramo" />
  {{ ramo }}
</button>
<svg class="controles-janela" viewBox="0 0 120 24" focusable="false" aria-hidden="true">
  <path d="M8 13h14" />
  <path d="M52 5h11v11H52z M63 5l2-2v11l-2 2" />
  <path d="M96 4l12 14M108 4L96 18" />
</svg>
