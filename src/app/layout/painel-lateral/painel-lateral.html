<div class="barra-fechar">
  <button type="button" class="fechar-gaveta" (click)="fecharGaveta.emit()">
    <app-glifo-fechar />
    Fechar seções
  </button>
</div>
<div class="cabecalho" aria-hidden="true">
  <span class="titulo">
    Portfolio_Vinicius
    <app-glifo-fechar class="fechar" />
  </span>
  <span class="minimizar"></span>
  <span class="restaurar"></span>
</div>
<app-arvore-de-secoes
  [noInicio]="noInicio()"
  [todasAbertas]="gavetaAberta()"
  (secaoEscolhida)="secaoEscolhida.emit()"
/>
<!-- Só na gaveta do celular: no desktop o repositório se abre pela branch da barra superior. -->
<a
  class="repositorio"
  routerLink="/repositorio"
  routerLinkActive="atual"
  ariaCurrentWhenActive="page"
  (click)="secaoEscolhida.emit()"
>
  <app-icone nome="ramo" />
  Repositório
</a>
<div class="rodape" aria-hidden="true">
  <span class="polegar"></span>
</div>
