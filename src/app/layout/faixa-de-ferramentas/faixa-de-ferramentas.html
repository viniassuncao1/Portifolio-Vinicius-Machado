<button
  type="button"
  class="botao"
  aria-label="Projeto"
  aria-controls="painel-lateral"
  [attr.aria-pressed]="painelVisivel()"
  (click)="alternarPainel.emit()"
>
  <app-icone nome="projeto" />
</button>
<button
  type="button"
  class="botao"
  aria-label="Commit"
  aria-controls="painel-do-git"
  [attr.aria-pressed]="git.aberto()"
  (click)="git.alternar($any($event.currentTarget))"
>
  <app-icone nome="commit" />
</button>
<span class="botao" aria-hidden="true"><app-icone nome="estrutura" /></span>
