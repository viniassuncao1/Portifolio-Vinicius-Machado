@if (estado() !== 'oculta') {
  <div class="tela" role="status" [attr.data-estado]="estado()">
    <p class="somente-leitores">Carregando o portfólio de Vinicius Machado</p>
    <div class="cartao" aria-hidden="true">
      <img
        class="foto"
        ngSrc="fotos/vinicius.webp"
        width="96"
        height="96"
        priority
        alt="Foto de Vinicius Machado"
      />
      <h2 class="nome">Vinicius Machado</h2>
      <p class="cargo">Desenvolvedor Full Stack Júnior</p>
      <p class="frase">Seja bem-vindo ao meu portfólio</p>
      <div class="barra">
        <span class="preenchimento" [style.--progresso]="progresso()"></span>
      </div>
      <p class="etapa">{{ linhaDeStatus() }}</p>
    </div>
  </div>
}
