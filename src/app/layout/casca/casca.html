<app-barra-de-ferramentas
  [gavetaAberta]="gavetaAberta()"
  (alternarGaveta)="alternarGaveta()"
  (buscar)="abrirBusca()"
/>
<div class="area" [attr.data-painel]="painelVisivel()">
  <app-faixa-de-ferramentas [painelVisivel]="painelVisivel()" (alternarPainel)="alternarPainel()" />
  <app-painel-lateral
    id="painel-lateral"
    [attr.data-aberta]="gavetaAberta()"
    [noInicio]="arvoreNoInicio()"
    (secaoEscolhida)="fecharEDevolverFoco()"
    (fecharGaveta)="fecharEDevolverFoco()"
  />
  <div class="coluna-editor">
    <div class="faixa">
      <app-faixa-de-abas />
    </div>
    <main class="editor">
      <h1 class="somente-leitores">{{ titulo() }}</h1>
      <div #conteudo class="conteudo">
        <router-outlet />
      </div>
      <div class="scrollbar" aria-hidden="true">
        <span class="polegar"></span>
      </div>
    </main>
  </div>
</div>
<app-barra-de-status />
<app-busca-de-secoes />
<app-janela-de-preview />
