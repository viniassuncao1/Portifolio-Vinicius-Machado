<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Vinicius Machado | Desenvolvedor Full Stack</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Vinicius Machado, desenvolvedor Full Stack em Java, Spring Boot, Angular e SQL. Veja projetos, experiências e certificações."
    />
    <meta name="theme-color" content="#2B2B2B" />
    <!-- Aplica o tema antes da primeira pintura, para a página não piscar no outro tema. Só lê o
         localStorage e o matchMedia e ajusta a theme-color; o serviço Tema (core/tema.ts) cuida do resto. -->
    <script>
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem('tema');
        } catch (e) {}
        try {
          if (tema !== 'claro' && tema !== 'escuro') {
            tema = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro';
          }
          var raiz = document.documentElement;
          raiz.setAttribute('data-tema', tema);
          raiz.style.colorScheme = tema === 'claro' ? 'light' : 'dark';
          // Mesma cor de --cor-painel no tema claro (_tokens.scss): a barra do navegador no
          // celular acompanha sem esperar a hidratação. No escuro, vale o content do HTML.
          if (tema === 'claro') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ececec');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
